- nome: Astrologo
  autori:
  - The Kernel In Yellow
  descrizione: Mi spiace dirvi, mio caro, che questo non è affatto un buon giorno
    per combattere. L’influenza di Marte è molto debole e chi attaccasse per primo
    perderebbe certamente. Ma ora che lo sappiamo entrambi nessuno vorrà sferrare
    il primo colpo...
  averi: un libro pieno di schemi astrali e orbite, un calendario dei prossimi 10
    anni e degli abiti eleganti
  bonus:
  - tipo: "salute"
    quantita: 2
  - tipo: "statistica"
    statistica: carisma
  - tipo: "oggetto"
    nome: Libro pieno di schemi astrali e orbite
  - tipo: "oggetto"
    nome: Calendario dei prossimi 10 anni
  avanzamenti:
  - 'Miglioria: +1 ad una Statistica a scelta.'
  - 'Tema Natale: facendo domande inopportune a una persona per oltre 4 ore, sei in
    grado di compilarne il Tema Natale, che dirà a te (e a lei, se glielo sveli) tutto
    quello che c’è da sapere sull’influenza dei pianeti sulla sua vita. Conosci sempre
    il tuo Tema Natale, ma puoi memorizzarne uno per ogni livello da Astrologo.'
  - 'Scritto nelle stelle: quando apprendi la data di nascita di un PNG, il master
    ti rivelerà un’informazione sul suo carattere.'
  - 'Medicina degli astri: se conosci il Tema Natale di una persona malata, puoi tentare
    di capire quali umori la influenzino e suggerire una terapia.'
  - 'Una giornata propizia: puoi consumare un Pianeta per applicare il bonus/malus
    di un’influenza a tutte le tue azioni della giornata. Tira il dado una sola volta.
    Non puoi avere più di un’influenza alla volta attiva così.'
  - 'La lingua dei pianeti: puoi comunicare attraverso contorte simbologie astrologiche,
    comprensibili solo a chi le conosce. Potete parlare di qualsiasi cosa, ma ci sono
    sempre 2-su-6 possibilità di fraintendimento. Agli altri, il vostro discorso sembrerà
    tanto dotto e coerente quanto totalmente privo di senso.'
  - 'Un po’ di Alchimia: mastichi anche un po’ di alchimia. Sei in grado di eseguire
    semplici operazioni alchemiche quali l’estrazione di tinture o la miscela di pozioni
    di cui conosci la ricetta.'
  - 'Influenze complesse: Una volta al giorno, puoi effettuare un’analisi astrologica
    profonda e complessa, determinando le influenze di più pianeti contemporaneamente.
    Se lo fai, assegna due Pianeti alla volta.'
  - 'Influenze fini: Impiegando il doppio del tempo, puoi cogliere solo i momenti
    più propizi o negativi nella tua analisi e assegnare solo il bonus o il malus
    di un Pianeta.'
  - 'L’oracolo dei cieli: avendo accesso ai tuoi materiali e con un’ora di analisi
    accurata, puoi sapere se un evento futuro si verificherà o meno. Hai ragione [Livello]-su-6
    volte (+1 se conosci il Tema Natale di chi compirà l’azione). L’evento deve avvenire
    tra almeno 24 ore e fino a 500 anni nel futuro.'
  - 'L’oroscopo di Nostro Signore: hai compilato un Tema Natale accurato del Salvatore
    in persona. Alcuni vedono questo gesto come eretico, altri come uno degli studi
    più nobili. Occupa lo spazio di un Tema Natale e non puoi dimenticarlo, ma puoi
    farvi riferimento una volta a settimana per trovare un momento particolarmente
    propizio per le arti sovrannaturali. Se lo fai, aggiungi 1d6 al prossimo tiro
    per resistere o lanciare Incantesimi o Miracoli. Inoltre, puoi considerare questo
    Tema Natale come noto quando usi l’Oracolo dei cieli su eventi che non vengono
    compiuti da agenti umani (catastrofi naturali, infestazioni demoniache...).'
  - 'Ingannare gli stolti: mentre compili l’oroscopo a qualcuno, puoi effettuare una
    prova di Carisma per persuaderlo o dissuaderlo dal compiere un’azione precisa.
    Qualunque sia il risultato, non sarai mai abbastanza diretto perché il tuo bersaglio
    si accorga che è stata tutta un’idea tua.'
  elenchi:
  - nome: Influenza dei pianeti
    descrizione: Possiedi 1+[Livello] Pianeti (d6 di colore grigio) giornalieri. Tramite
      qualche minuto di analisi del Tema Natale del tuo bersaglio e del momento corrente,
      puoi assegnare un Pianeta a te o a qualcuno di cui conosci il Tema Natale (vedi
      sopra), da aggiungere o sottrarre a un tiro che rispetti i requisiti nella prossima
      ora. Ogni personaggio può avere una sola influenza alla volta. Puoi anche fare
      un’analisi generale e lanciare un Pianeta, per dare a tutti un bonus/malus pari
      al risultato per i prossimi 10 minuti, per tutti i tiri a cui si applica. Al
      primo livello e ad ogni livello successivo impari a riconoscere un’Influenza
      casuale.
    tabella: INFLUENZA_DEI_PIANETI
    quantita_iniziale: 1
  - nome: Perché hai dovuto lasciare la corte e vivere da povero gaglioffo?
    tabella: EVENTI_ASTROLOGO
    quantita_iniziale: 1
  tabelle:
    INFLUENZA_DEI_PIANETI:
    - 'Influenza del Sole: Somma il risultato del dado a un tiro in cui segui la tua
      coscienza o ciò che ti rende unico. Sottrailo se invece ti comporti in modo
      egoistico o conformista.'
    - 'Influenza della Luna: Somma il risultato del dado a un tiro in cui fai appello
      all’emotività o spingi verso l’azione. Sottrailo se invece fai appello alla
      logica o inviti alla prudenza.'
    - 'Influenza di Mercurio: Somma il risultato del dado a un tiro in cui cerchi
      di stabilire un contatto o fai i tuoi interessi di venditore. Sottrailo se invece
      cerchi di evitare di parlare o fai i tuoi interessi di acquirente.'
    - 'Influenza di Marte: Somma il risultato del dado a un tiro in cui fai ricorso
      alla violenza, anche difensiva, o fai appello a coraggio o desiderio. Sottrailo
      se cerchi di evitare lo scontro fisico o inviti alla fuga o alla resa.'
    - 'Influenza di Venere: Somma il risultato del dado a un tiro in cui ti metti
      in pericolo per il tuo amore o i tuoi affetti. Sottrailo se le tue azioni puntano
      a separare famiglie, amici o amanti.'
    - 'Influenza di Giove: Somma il risultato del dado a un tiro in cui usi o fai
      appello a fede o ottimismo o in cui ti rivolgi a un’autorità. Sottrailo se invece
      punti ad ateismo e pessimismo o se parli con ribelli e criminali.'
    - 'Influenza di Saturno: Somma il risultato del dado a un tiro in cui cerchi di
      ottenere o usare argomenti da sapiente o se il tuo bersaglio è una persona anziana.
      Sottrailo se cerchi di impedire l’accesso alla conoscenza o se il tuo bersaglio
      è giovane.'
    - 'Influenza di Urano: Somma il risultato del dado a un tiro in cui cerchi di
      creare qualcosa di nuovo o di portare un cambiamento imprevisto nella vita di
      qualcuno. Sottrailo se invece cerchi di resistere al cambiamento o fai uso di
      strumenti vecchi.'
    - 'Influenza di Nettuno: Somma il risultato del dado a un tiro per comprendere
      le emozioni altrui o per confondere il tuo bersaglio con parole, gesti o sostanze.
      Sottrailo se sei tu a voler resistere a confusione o dipendenze.'
    - 'Influenza di Plutone: Somma il risultato del dado a un tiro in cui cerchi di
      nascondere te stesso o un oggetto che porti con te o se stai occultando la verità.
      Sottrailo ai tiri per resistere a trappole nascoste o per rivelare i segreti
      altrui.'
    EVENTI_ASTROLOGO:
    - Un astrologo più abile di te ti ha scacciato.
    - Hai previsto una disgrazia al tuo signore. Avevi ragione.
    - Hai previsto una grande fortuna al tuo signore. Non ti sei mai sbagliato così
      tanto in vita tua.
    - La Chiesa ha iniziato a sospettarti di stregoneria.
    - Sei stato beccato a fare l’”oroscopo” alla moglie del tuo signore.
    - Hai fatto il tuo stesso oroscopo e hai visto che questo sarebbe stato il tuo
      destino.
- nome: Savio
  autori:
  - The Kernel In Yellow
  descrizione: Non preoccupatevi, so tutto su queste creature. No, non le ho mai viste,
    ma ho letto Aristotele e lui ne parlava
  averi: un paio d’occhiali, un tomo voluminoso, una fama
  bonus:
  - tipo: "salute"
  - tipo: "statistica"
    statistica: saggezza
  - tipo: "oggetto"
    nome: Un paio d’occhiali
    ingombro: 0
  - tipo: "oggetto"
    nome: Un tomo voluminoso
    ingombro: 2
  avanzamenti:
  - 'Una pergamena: Aggiungi un nuovo Argomento al tuo tomo.'
  - 'Nom de plume: Hai un secondo nome sotto cui hai pubblicato alcuni testi diversi
    dai tuoi normali interessi. Tira una seconda fama. Puoi presentarti col nome che
    preferisci e non conta come mentire. Puoi anche rivelare entrambi i nomi a qualcuno,
    ma questo potrebbe metterti nei guai.'
  - 'Molti maestri: Quando entri in una nuova città o in un monastero, tira 1d6: con
    4+ hai studiato presso un grande saggio che ora risiede qui. Siete ancora in buoni
    rapporti e ti aiuterà in cambio di chiacchiere interessanti. Se la città ha un''università,
    il successo è automatico.'
  - 'Pettegolezzi: Gli studiosi sono creature pettegole e sono letteralmente dappertutto
    nelle corti dei potenti. Quando incontri o senti menzionare una persona importante
    (nobile, membro delle gerarchie ecclesiastiche...) tira su Saggezza. Se hai successo,
    il Master ti dirà un segreto scabroso su questa persona.'
  - 'Autorità: Quando stai discutendo di argomenti dotti con qualcuno che non è d''accordo
    con te, puoi semplicemente dire chi sei e tirare d6+Livello. Se l''Argomento è
    nel tuo tomo, aggiungi 1. Con 5 o più, tutti quanti concorderanno che hai ragione
    te in virtù della tua esperienza.'
  - 'Un uomo di lettere, non di guerra: se stai combattendo contro nemici civilizzati,
    una volta al giorno puoi semplicemente dichiarare che non sei un uomo di guerra
    e ritirarti dal combattimento. Finché non attacchi di nuovo sarai lasciato stare,
    ma subirai comunque le conseguenze di una sconfitta (arresto, esilio...).'
  - 'Il sesso degli angeli: una volta al giorno, puoi fermare un qualsiasi gruppo
    di creature che capiscano la tua lingua per 1d6+Livello minuti intavolando una
    lunga discussione su argomenti completamente futili. La discussione non degenererà
    in violenza, né ti fornirà informazioni utili (di informazioni inutili, invece,
    ne otterrai a bizzeffe) e al termine della stessa le creature riprenderanno quello
    che stavano facendo. Se attaccate, le creature abbandoneranno la discussione.
    Se ti allontani, durerà solo 1 altro minuto.'
  - 'Virtute e Canoscenza: pezzenti, popolani e sgherri assumeranno che tu abbia ragione
    quando parli di qualcosa. Se dovesse saltare fuori che ti sbagliavi, hai 4-su-6
    possibilità che si fidino ancora di te la prossima volta. Riduci di 1 per ogni
    volta che ti sei sbagliato in loro presenza.'
  - 'Belle lettere: le tue lettere ti permettono di effettuare prove di Carisma a
    distanza, a patto che il tuo bersaglio sappia leggere. Quando invece leggi un
    testo, puoi effettuare un tiro di Saggezza per capire le intenzioni di chi scrive,
    la presenza di codici in un testo (non è detto che tu sappia interpretarli) o
    le inconsistenze di un testo complesso.'
  - 'Compagni di studi: Quando entri in una nuova città o in un monastero, tira 1d4:
    il risultato è il numero di ex compagni di studi che vi si trovano. Si ricordano
    di te e della tua fama e sono genericamente ben disposti nei tuoi confronti.'
  - 'Conoscenza Oscura: Una volta a sessione, puoi declamare qualcosa che ritieni
    vero perché l''hai letto in un libro. Hai 3-su-6 possibilità che sia vero (non
    saprai se è vero immediatamente, ma verrà determinato dal Master al momento opportuno).
    Deve esserci una motivazione plausibile perché tu possa trovare quest''informazione
    in un libro (novità e segreti personali sono improbabili). Potresti avere ragione
    solo parzialmente, ma non ti sbaglierai mai del tutto. Se parli di un Argomento
    del tuo tomo, le possibilità di avere ragione diventano 4-su-6.'
  - 'La Rete: conosci gente che conosce altra gente che conosce altra gente... Puoi
    sfruttare questa rete per far arrivare un messaggio scritto e firmato a una persona
    che vuoi, anche se non la conosci direttamente, in 2d6 settimane. Una risposta
    ci impiega lo stesso tempo e, anche se ti sposti, riuscirà a ritrovarti.'
  elenchi:
  - nome: Il tomo
    descrizione: Il Tomo è la tua opera omnia, ancora in lavorazione, di filosofia
      universale. Un giorno conterrà tutto il sapere umano e ti renderà un grande
      dotto. Nel frattempo, puoi consultarlo per sommare il tuo Livello a Saggezza
      nelle prove che riguardano i suoi Argomenti. Inizi con 3 Argomenti (ritira i
      doppi).
    tabella: ARGOMENTI_TOMO
    quantita_iniziale: 3
  - nome: Fama
    descrizione: >-
      Coi tuoi studi e le tue pubblicazioni ti sei fatto una certa fama. Nobili, uomini

      dotti, membri del clero e arruffapopoli la sanno associare al tuo nome.
    tabella: FAMA
    quantita_iniziale: 1
  tabelle:
    ARGOMENTI_TOMO:
    - Teologia
    - Geologia
    - Geografia
    - Araldica
    - Storia
    - Letteratura
    - Legge
    - Botanica
    - Matematica
    - Architettura
    - Ingegneria
    - Medicina
    - Zoologia
    - Alchimia
    - Astrologia
    - Pittura e scultura
    - Metallurgia
    - Genealogia delle famiglie nobili
    - Diritto canonico
    - Demonologia
    FAMA:
    - 'Eresiarca: i tuoi testi critici della Chiesa hanno ottenuto una certa trazione
      tra il popolino vessato. Nobili, vescovi e sgherri cercheranno di arrestarti,
      ma hai la simpatia del popolino e degli ordini mendicanti.'
    - 'Alleato dei nobili: hai scritto spesso per giustificare i privilegi della nobiltà
      sul popolo. I nobili ti adorano, gli ecclesiastici ti tollerano e, per tua fortuna,
      ben pochi tra i pezzenti sanno leggere.'
    - 'Uomo dell’Impero: hai sostenuto il primato dell’Impero nel tuo Paese. Sei antipatico
      a tutti, ma piuttosto intoccabile. I messi dell’Imperatore ti adorano.'
    - 'Causa persa: hai sostenuto la persona sbagliata in una disputa dinastica. Ora
      che la sua testa è su una picca, sei guardato con sospetto dai vincitori, ma
      un piccolo gruppo di ribelli che non è ancora stato spazzato via ti adora.'
    - 'Uomo del Papa: hai sostenuto il primato della Chiesa sui governi terreni. Re,
      nobili e imperatori ti disprezzano cordialmente, mentre la Chiesa ti supporta.'
    - 'Conoscenza Proibita: hai parlato di cose di cui era meglio non parlare. Le
      autorità costituite ti guardano con sospetto, ma maghi, alchimisti e stramboidi
      vari ti rispettano come una grande autorità.'
