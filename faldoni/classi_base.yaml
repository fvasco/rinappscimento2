  MIRACOLI:
  - >-
    Abominio

    Area: un cerchio tracciato a terra col bastone. Durata: [dadi] turni.

    Dichiara cosa ritieni abominevole. Ad esempio, i maiali, le persone calve o il
    colore verde. Quella cosa non può entrare nel cerchio.
  - >-
    Mente ferma

    Bersaglio: una creatura baciata sulla fronte. Durata: [dadi] turni.

    La creatura ottiene immunità da qualsiasi effetto mentale ostile, provocato da
    creature di Livello pari o inferiore a [dadi].
  - >-
    Imposizione delle mani

    Bersaglio: una creatura su cui imponi le mani. Durata: istantaneo.

    Cura [somma] Ps della creatura. Se investi 4 [dadi] o più, puoi curare una cicatrice
    o una malattia.
  - >-
    Vincolo

    Bersaglio: una creatura a vista. Durata: [dadi] turni.

    La creatura è vincolata e immobile. Può respirare e muovere gli occhi, ma non
    può nuotare, volare o compiere altre azioni. La creatura può effettuare un tiro
    salvezza ogni round per liberarsi, con una penalità pari ai [dadi] che hai investito.
  - >-
    Pura visione

    Bersaglio: sé stesso. Durata: [dadi] turni.

    Puoi vedere ciò che è invisibile e attraverso le illusioni. Se investi 2+ [dadi]:
    puoi anche vedere se qualcuno è posseduto o sta mentendo, guardandolo negli occhi.
  - >-
    Mensa del Signore

    Bersaglio: delle pietre al tocco. Durata: permanente.

    Crei abbastanza cibo per nutrire [dadi] persone per un pasto, ed acqua limpida
    per dissetarle. Tazze, utensili e condimenti non vengono forniti.
  - >-
    Bastone di Aronne

    Bersaglio: un ramo secco. Durata: permanente.

    Il ramo diventa un serpente. Ha 1-su-6 di essere velenoso (+1 per ogni [dado]
    investito oltre il primo, veleno mortale). Tira sotto [somma] per controllarlo.
  - >-
    Rammendo

    Bersaglio: un oggetto rotto o consumato, al tocco. Durata: istantanea.

    Ripara l’oggetto o ne ripristina la funzione originale. Non funziona sulle armi,
    sugli oggetti sacri o su quelli magici.
  - >-
    Primavera

    Bersaglio: [somma] piante, al tocco. Durata: istantanea.

    La vita vegetale cresce fino a [dadi]+1 volte la sua dimensione. Se [dadi] è maggiore
    di 2, puoi fargli assumere una forma specifica e fargli afferrare oggetti e creature.
  - >-
    Aprire le acque

    Bersaglio: [dadi] d’acqua, a vista. Durata: [somma] turni.

    Ogni [dado] investito permette di cambiare forma o prosciugare: 1. un secchio
    d’acqua, 2. un pozzo, 3. un fiume, 4. un lago, 5. la pioggia, 6. il mare.
  MOTIVAZIONI_PER_CAMPARE:
  - 'Amore totale: guidato dall''amore incondizionato per ogni cosa.'
  - 'Ambizione patologica: ossessionato dal miglioramento personale.'
  - 'Egocentrico: devi essere sempre al centro dell''attenzione.'
  - 'Il prescelto: devi realizzare una profezia.'
  - 'Sei stato gentile con me: sei fedele ad un altro Pg per un singolo gesto gentile.'
  - 'Eroe cronico: sei costretto ad aiutare tutti, sempre.'
  - 'Maniaco del controllo: su te stesso, sulle altre persone e sul tuo ambiente.'
  - 'Desiderio darwinista: vuoi riprodurti con il miglior partner possibile.'
  - 'Disperata ricerca di uno scopo: in viaggio per trovare un posto nel mondo.'
  - 'Disperato bisogno d’affetto: puoi fare di tutto per ottenerlo.'
  - 'Disperato bisogno di ordini: manchi completamente di iniziativa.'
  - 'Nichilista: vuoi vedere bruciare il mondo.'
  - 'Incarnazione del vizio: sei guidato da una qualità negativa.'
  - 'Incarnazione della virtù: sei guidato da una virtù morale.'
  - 'Molti nemici, molto onore: le angherie ti motivano a fare grandi cose.'
  - 'Cavaliere caduto: non hai protetto qualcuno e non vuoi più fallire.'
  - 'Onore di famiglia: vuoi essere all''altezza del tuo cognome.'
  - 'Snack gratis: faresti qualsiasi cosa per ottenere del cibo a scrocco.'
  - 'Per la scienza: desideri fare nuove scoperte scientifiche.'
  - 'Per il lol: ami gli scherzi, anche se vanno contro il tuo interesse.'
  - 'La solita scusa freudiana: il passato ti smuove, di solito è colpa dei genitori.'
  - 'Malato immaginario: stai sempre male, per un motivo o per l''altro.'
  - 'Cercatore di gloria: vuoi che gli altri ti considerino un duro.'
  - 'Gotta catch ‘em all: vuoi terminare la tua collezione.'
  - 'Oro: sei ossessionato da una particolare forma di ricchezza.'
  - 'Malato cronico: hai un disperato bisogno di soldi per pagarti le cure mediche.'
  - 'L''edonista: vuoi provare ogni tipo di piacere, anche a spese degli altri.'
  - 'Casa dolce casa: stai solo cercando di sistemare le cose prima di tornare a casa.'
  - 'Voglio solo essere libero: vuoi la libertà da qualche tipo di schiavitù.'
  - 'Voglio solo essere normale: vuoi solo vivere una vita senza eccitazione.'
  - 'L’adrenalina: cerchi costantemente eccitazione e pericolo.'
  - 'Tutto è perduto: desideri che la società venga distrutta o abbandonata.'
  - 'Voglio essere un vero uomo: vuoi dimostrare la tua umanità.'
  - 'Ti troverò: vuoi ritrovare una persona cara perduta o rapita.'
  - 'Vivere un sogno d''infanzia: ora che sei un adulto te lo puoi permettere.'
  - 'Il mio padrone: fai ciò che deve essere fatto a beneficio del tuo padrone.'
  - 'Amante della natura: sei guidato da una profonda affinità per la natura.'
  - 'Proposito per il nuovo anno: un nuovo inizio ti ha spinto ad agire.'
  - 'Bullo sotto pressione: fai il prepotente a causa della pressione sociale.'
  - 'Contro il cielo: vuoi che gli dèi paghino per quello che hanno fatto.'
  - 'V per vendetta: vuoi che qualcuno paghi per ciò che ha fatto.'
  - 'Fanculo il destino: vuoi andare contro una profezia.'
  - 'La resurrezione di un altro: cerchi di resuscitare qualcuno.'
  - 'Mi chiamavano pazzo: sei motivato dalle offese che hai ricevuto in passato.'
  - 'Sogno tragico: desideri qualcosa che non potrai mai avere.'
  - 'Troll: ti diverti a provocare gli altri.'
  - 'Ben fatto figliolo: desideri l''approvazione di un genitore o di un modello.'
  - 'Ben fatto papà: desideri l''approvazione dei tuoi figli o seguaci.'
  - 'Frankenstein: vuoi riparare o migliorare il tuo corpo.'
  - 'Maledizione: qualcuno ti ha maledetto e ora sei costretto a fare quello che fai.'
  - 'Debito: devi restituire una cifra impressionante a qualcuno.'
  - 'Estremista: credi in un ideale e sei disposto a tutto per raggiungerlo.'
  - 'Rabbia incontenibile: qualcosa ti fa incazzare e ti tiene in vita.'
  - 'Voglio essere ricordato: cerchi la fama oltre la morte.'
  - 'Ho qualcosa da dire: cerchi l’ispirazione per riuscire finalmente ad esprimerti.'
  - 'Patria o morte: non c’è nulla di più importante del luogo da cui provieni.'
  - 'La vocina nella testa: qualcuno o qualcosa ti sussurra cosa fare.'
  - 'Mamma orsa: vuoi solo prenderti cura di questi poveri gaglioffi.'
  - 'Il Papa: la sua parola è legge.'
  - 'Il Diavolo: la sua parola è caos.'
